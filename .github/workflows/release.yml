name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Also writes latest.json, which is what installed copies poll to find
      # out an update exists.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SoundBox ${{ github.ref_name }}
          releaseBody: |
            Installed copies will offer this automatically. Otherwise download below.

            **Windows:** the `-setup.exe`. Unsigned, so SmartScreen warns:
            "More info" then "Run anyway".

            **Linux:** the `.AppImage`, `chmod +x`, run.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The updater fetching the public installers made every auto-update count as
  # a download. It gets its own byte-identical copies (signatures still verify)
  # so the installer counts only reflect manual downloads.
  updater-copies:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Point latest.json at update- copies
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json
          for url in $(jq -r '[.platforms[].url] | unique[]' latest.json); do
            name="${url##*/}"
            case "$name" in update-*) continue ;; esac
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$name"
            mv "$name" "update-$name"
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "update-$name" --clobber
          done
          jq '.platforms |= map_values(.url |= (if test("/update-[^/]*$") then . else sub("/(?<f>[^/]+)$"; "/update-\(.f)") end))' \
            latest.json > latest.tmp
          mv latest.tmp latest.json
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" latest.json --clobber
